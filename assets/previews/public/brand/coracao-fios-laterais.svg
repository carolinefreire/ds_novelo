 <path d="M -48 276 C 45 259 116 278 196 250 C 259 327 367 416 476 450 C 587 412 688 322 750 250 C 841 269 913 240 1008 230" stroke="#fff6e0" stroke-opacity=".19" stroke-width="3.1" stroke-linecap="round"/>
 <path d="M -48 258 C 41 234 112 266 196 250 C 177 207 186 135 238 100 C 303 55 397 78 476 158 C 552 80 644 55 709 104 C 768 147 763 215 750 250 C 823 261 889 228 1008 214" stroke="#fff6e0" stroke-opacity=".22" stroke-width="2.8" stroke-linecap="round"/>
</g>
</svg>