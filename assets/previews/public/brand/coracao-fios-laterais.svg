<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35 36 1030 450" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Coração Novelo feito por dois fios de lã que chegam pelas laterais</title>
<desc id="desc">Dois fios multicoloridos com textura de fibras entram pela esquerda e pela direita e formam o contorno aberto de um coração com pontas entrelaçadas.</desc>
<defs>
 <linearGradient id="fioSuperior" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#fa144d"/><stop offset=".19" stop-color="#fa5930"/><stop offset=".29" stop-color="#ffb02a"/><stop offset=".39" stop-color="#f0d430"/><stop offset=".48" stop-color="#63aa56"/><stop offset=".58" stop-color="#e52ca5"/><stop offset=".72" stop-color="#7145ce"/><stop offset=".86" stop-color="#05a4c4"/><stop offset="1" stop-color="#139dd7"/>
 </linearGradient>
 <linearGradient id="fioInferior" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#f81f56"/><stop offset=".17" stop-color="#ff7041"/><stop offset=".28" stop-color="#ff8e28"/><stop offset=".43" stop-color="#f03688"/><stop offset=".52" stop-color="#c524c3"/><stop offset=".66" stop-color="#8c34d6"/><stop offset=".80" stop-color="#135cbf"/><stop offset="1" stop-color="#149ec8"/>
 </linearGradient>
 <linearGradient id="threadShine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white" stop-opacity=".22"/><stop offset=".5" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="#481254" stop-opacity=".13"/></linearGradient>
 <pattern id="braid" width="14" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(33)">
  <path d="M0 0V13 M7 0V13" stroke="#fff8e4" stroke-opacity=".17" stroke-width="2.1"/>
  <path d="M3 0V13 M10 0V13" stroke="#502155" stroke-opacity=".13" stroke-width="1.15"/>
 </pattern>
 <filter id="softWool" x="-10%" y="-15%" width="120%" height="130%">
  <feTurbulence type="fractalNoise" baseFrequency=".028 .23" numOctaves="3" seed="9" result="fiber"/>
  <feDisplacementMap in="SourceGraphic" in2="fiber" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="shade" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="1.2" dy="4.2" stdDeviation="4" flood-color="#4b1949" flood-opacity=".22"/>
 </filter>
</defs>
<g filter="url(#shade)">
