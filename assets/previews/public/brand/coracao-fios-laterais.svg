  <path d="M -48 276 C 45 259 116 278 196 250 C 259 327 367 416 476 450 C 587 412 688 322 750 250 C 841 269 913 240 1008 230" stroke="url(#fioInferior)" stroke-width="39"/>
  <path d="M -48 276 C 45 259 116 278 196 250 C 259 327 367 416 476 450 C 587 412 688 322 750 250 C 841 269 913 240 1008 230" stroke="url(#braid)" stroke-width="35"/>
  <path d="M -48 258 C 41 234 112 266 196 250 C 177 207 186 135 238 100 C 303 55 397 78 476 158 C 552 80 644 55 709 104 C 768 147 763 215 750 250 C 823 261 889 228 1008 214" stroke="#431a55" stroke-opacity=".15" stroke-width="45"/>
  <path d="M -48 258 C 41 234 112 266 196 250 C 177 207 186 135 238 100 C 303 55 397 78 476 158 C 552 80 644 55 709 104 C 768 147 763 215 750 250 C 823 261 889 228 1008 214" stroke="url(#fioSuperior)" stroke-width="39"/>
  <path d="M -48 258 C 41 234 112 266 196 250 C 177 207 186 135 238 100 C 303 55 397 78 476 158 C 552 80 644 55 709 104 C 768 147 763 215 750 250 C 823 261 889 228 1008 214" stroke="url(#braid)" stroke-width="35"/>
