<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 315" role="img" aria-labelledby="t d"><title id="t">Pessoas diversas conectadas pela Novelo</title><desc id="d">Quatro profissionais com aparências, idades e estilos diversos, sorridentes e unidos por fios coloridos.</desc>
