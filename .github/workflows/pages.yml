name: Publicar Design System Novelo

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'index.html'
      - 'apresentacao.html'
      - 'apresentacao/**'
      - 'apresentacao.css'
      - 'apresentacao.js'
      - 'apresentacao-data.js'
      - 'curadoria.html'
      - 'styles.css'
      - 'curadoria.css'
      - 'app.js'
      - 'curadoria.js'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar site estatico
        run: |
          mkdir -p _site
          cp index.html apresentacao.html apresentacao.css apresentacao.js apresentacao-data.js curadoria.html styles.css curadoria.css app.js curadoria.js _site/
          cp -R assets data apresentacao _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/apresentacao.html
          test -s _site/apresentacao/index.html
          test -s _site/apresentacao.css
          node --check _site/apresentacao.js
          node --check _site/apresentacao-data.js
          test -s _site/data/acervo.json
          test -s _site/data/curadoria-original-2026-11-24.json
          test -s _site/data/historico-manifest.json
          node --check _site/curadoria.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
