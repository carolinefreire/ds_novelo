name: Curadoria Novelo (registro manual por Issues)

# Abertura de Issues é apenas registro. Não há automação de escrita
# nem acesso ao token do repositório principal.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar curadoria somente consultiva
        run: |
          echo "Abertura de Issues nao executa aprovacao, exclusao ou alteracao de arquivos."
          echo "Apenas o repositorio pode ser alterado por procedimentos administrativos separados."
