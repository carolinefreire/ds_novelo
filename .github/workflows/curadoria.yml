name: Curadoria Novelo (somente administradora)

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: novelo-curadoria
  cancel-in-progress: false

jobs:
  revisar:
    if: github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.user.login == 'carolinefreire' && github.actor == 'carolinefreire'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar sintaxe do fluxo administrativo
        run: node --check scripts/curadoria.mjs
      - name: Registrar decisão autorizada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVELO_GITHUB_TOKEN: ${{ secrets.NOVELO_GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/curadoria.mjs
