name: Reparar GitHub Pages (dominio e publicacao)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remover dominio invalido e habilitar Pages
        env:
          DS_PAGES_ADMIN_TOKEN: ${{ secrets.DS_PAGES_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          token = os.environ.get('DS_PAGES_ADMIN_TOKEN', '')
          if not token:
              sys.exit('Falta o segredo DS_PAGES_ADMIN_TOKEN. Configure um fine-grained PAT limitado a este repositorio, com Pages e Administration em Read and write.')
          url = 'https://api.github.com/repos/' + os.environ['REPO'] + '/pages'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'novelo-pages-repair'
          }
          def api(method, payload=None):
              data = json.dumps(payload).encode('utf-8') if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8', 'replace')
                  try: msg = json.loads(raw).get('message','Erro desconhecido')
                  except ValueError: msg = 'Erro HTTP'
                  return e.code, {'message':msg}
          status, site = api('GET')
          if status == 404:
              print('Pages nao habilitado: criando com build_type workflow...')
              status, response = api('POST', {'build_type':'workflow'})
              if status not in (201, 202):
                  sys.exit('Falha na criacao do Pages: HTTP %s: %s' % (status,response.get('message')))
          elif status != 200:
              sys.exit('Falha ao consultar Pages: HTTP %s: %s' % (status,site.get('message')))
          print('Removendo dominio personalizado e selecionando GitHub Actions...')
          status, response = api('PUT', {'cname':None,'build_type':'workflow'})
          if status not in (200, 204):
              sys.exit('Falha ao atualizar Pages: HTTP %s: %s' % (status,response.get('message')))
          status, site = api('GET')
          if status != 200 or site.get('cname') or site.get('build_type') != 'workflow':
              sys.exit('Verificacao falhou: Pages nao confirmou dominio vazio + build_type workflow.')
          print('Pages corrigido. Dominio personalizado: nenhum. Fonte: GitHub Actions.')
          print('Agora execute Actions > Publicar Design System Novelo > Run workflow.')
          PY
