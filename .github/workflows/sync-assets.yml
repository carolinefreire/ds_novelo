name: Sincronizar somente recursos oficiais aprovados
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOVELO_GITHUB_TOKEN: ${{ secrets.NOVELO_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Importar bytes originais do repo privado com token do servidor
        run: |
          python3 <<'PY'
          import os,sys,json,base64,pathlib,urllib.request
          token=os.environ.get('NOVELO_GITHUB_TOKEN','')
          if not token:
              print('NOVELO_GITHUB_TOKEN ainda não foi configurado. Nenhum arquivo privado foi copiado.')
              sys.exit(0)
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'Novelo-DS-Approved-Assets'}
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as response:
                  return json.load(response)
          for original in ('public/logo-novelo.png','public/fio-coracoes.png'):
              from urllib.parse import quote
              info=fetch('https://api.github.com/repos/carolinefreire/novelo/contents/'+quote(original,safe='/')+'?ref=main')
              if info.get('encoding')=='base64' and info.get('content'):
                  raw=base64.b64decode(info['content'])
              else:
                  blob=fetch('https://api.github.com/repos/carolinefreire/novelo/git/blobs/'+info['sha'])
                  if blob.get('encoding')!='base64':raise RuntimeError('Bytes não disponíveis: '+original)
                  raw=base64.b64decode(blob['content'])
              dest=pathlib.Path('assets/brand')/pathlib.Path(original).name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(raw)
              print('Original copiado:',original,'bytes:',len(raw))
          for catalog in ('data/acervo.json','data/review-catalog.json'):
              p=pathlib.Path(catalog)
              doc=json.loads(p.read_text())
              records=doc['records'] if 'records' in doc else doc['items']
              for item in records:
                  path=item.get('source') if 'records' in doc else item.get('path')
                  if path in ('public/logo-novelo.png','public/fio-coracoes.png'):
                      item['path' if 'records' in doc else 'image']='assets/brand/'+path.split('/')[-1]
                      if 'records' in doc:item['status']='aprovado'
              p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persistir originais no DS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/ data/acervo.json data/review-catalog.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "assets: sincronizar exclusivamente logo e fio oficiais aprovados"
            git push origin HEAD:main
          else
            echo "Sem originais para publicar neste momento."
          fi
