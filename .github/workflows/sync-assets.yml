name: Sincronizar recursos visuais originais

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  espelhar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copiar bytes oficiais sem redesenho
        run: |
          python3 <<'PY'
          import urllib.request, json, base64, pathlib, time
          from urllib.error import HTTPError

          source='carolinefreire/novelo'
          headers={'Accept':'application/vnd.github+json','User-Agent':'Novelo-DS-official-assets-mirror','X-GitHub-Api-Version':'2022-11-28'}
          def get_json(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=35) as response:
                          return json.load(response)
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
          tree=get_json('https://api.github.com/repos/'+source+'/git/trees/main?recursive=1')
          if tree.get('truncated'): raise RuntimeError('Árvore incompleta: sincronização interrompida')
          entries=[x for x in tree.get('tree',[]) if x.get('type')=='blob' and (x['path'].startswith('public/') or x['path'].startswith('src/assets/')) and x['path'].lower().endswith(('.png','.jpg','.jpeg','.svg','.webp','.ico'))]
          if len(entries)<25: raise RuntimeError('Menos arquivos visuais que o esperado: ' + str(len(entries)))
          root=pathlib.Path('assets/espelho')
          for i,item in enumerate(entries,1):
              blob=get_json('https://api.github.com/repos/'+source+'/git/blobs/'+item['sha'])
              if blob.get('encoding')!='base64': raise RuntimeError('Blob não retornou base64 para '+item['path'])
              raw=base64.b64decode(blob['content'])
              dest=root.joinpath(*item['path'].split('/'))
              dest.parent.mkdir(parents=True,exist_ok=True)
              if not dest.exists() or dest.read_bytes()!=raw: dest.write_bytes(raw)
              print(f'{i}/{len(entries)} {item["path"]} ({len(raw)} bytes)')

          catalog=pathlib.Path('data/review-catalog.json')
          doc=json.loads(catalog.read_text())
          paths={item['path'] for item in entries}
          for record in doc['items']:
              if record['path'] in paths:
                  record['image']='assets/espelho/'+record['path']
          catalog.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')

          public=pathlib.Path('data/acervo.json')
          doc=json.loads(public.read_text())
          for record in doc['records']:
              if record.get('source')=='public/logo-novelo.png':
                  record['path']='assets/espelho/public/logo-novelo.png'
              if record.get('source')=='public/fio-coracoes.png':
                  record['path']='assets/espelho/public/fio-coracoes.png'
          public.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')

          replacements={
            'https://raw.githubusercontent.com/carolinefreire/novelo/main/public/logo-novelo.png':'assets/espelho/public/logo-novelo.png',
            'https://raw.githubusercontent.com/carolinefreire/novelo/main/public/fio-coracoes.png':'assets/espelho/public/fio-coracoes.png'
          }
          for path in ('index.html','curadoria.html'):
              html=pathlib.Path(path)
              text=html.read_text()
              for old,new in replacements.items(): text=text.replace(old,new)
              html.write_text(text)
          PY
      - name: Versionar apenas os originais e os links corrigidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/espelho data/review-catalog.json data/acervo.json index.html curadoria.html
          if ! git diff --cached --quiet; then
            git commit -m "assets: espelhar originais oficiais do Novelo e corrigir prévias"
            git push origin HEAD:main
          else
            echo "Arquivos oficiais já sincronizados."
          fi
