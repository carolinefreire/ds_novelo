name: Visualizar e testar o DS

on:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke.mjs'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Abrir servidor de arquivos local
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/novelo-pages-test.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/index.html >/dev/null
      - name: Testar navegação e interações
        run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelo-ds-preview
          path: preview-screenshots/*.png
